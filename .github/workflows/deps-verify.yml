# Records SHA-256 checksums of every Android build dependency (Gradle dependency verification).
# Runs only when this file changes; the result is saved to the ci-logs branch for review and commit.
name: Android dependency checksums
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deps-verify.yml']
permissions:
  contents: write
jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.14.3
      - name: Write verification metadata
        working-directory: android
        run: |
          mkdir -p app/src/main/assets/www && echo "<!doctype html>" > app/src/main/assets/www/index.html
          gradle --no-daemon --write-verification-metadata sha256 assembleRelease assembleDebug lint || true
          ls -la gradle/verification-metadata.xml
      - name: Save to ci-logs
        run: |
          git clone -q --depth 1 -b ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$RUNNER_TEMP/logs"
          cp android/gradle/verification-metadata.xml "$RUNNER_TEMP/logs/"
          cd "$RUNNER_TEMP/logs" && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-metadata.xml && git commit -qm "verification metadata" && git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-logs
