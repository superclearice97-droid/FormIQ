# Builds the FormIQ Android app from this repository and publishes FormIQ.apk as a GitHub release.
# The APK is signed with the key stored in the FORMIQ_SIGNING_KEY secret ("password:base64-of-pkcs12").
# Without that secret the build still runs as a check, but nothing is published.
# Each release is installable over the previous one because every build uses the same key.
name: Android app
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/workflows/probe.yml', '.github/workflows/vendor.yml', '.github/workflows/deps-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.7.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: 8.14.3
      - name: Put the web app inside the APK
        run: |
          W=android/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W"
          cp index.html privacy.html terms.html licenses.html *.js "$W/"
          cp -r vendor "$W/vendor"
          rm -f "$W/vendor/models/pose_landmarker_heavy.task" "$W/vendor/MANIFEST"
          du -sh "$W"
      - name: Signing key
        env:
          KEY: ${{ secrets.FORMIQ_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s' "${KEY#*:}" | base64 -d > "$RUNNER_TEMP/formiq.p12"
            echo "FORMIQ_KEYSTORE=$RUNNER_TEMP/formiq.p12" >> "$GITHUB_ENV"
            echo "FORMIQ_KS_PASS=${KEY%%:*}" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No signing key yet: building as a check only."
          fi
      - name: Build
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace --warning-mode=summary 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Publish release
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FormIQ.apk
          SUM=$(sha256sum FormIQ.apk | cut -d' ' -f1)
          CERT=$("$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs FormIQ.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //')
          gh release create "v$VERSION_NAME" FormIQ.apk --title "FormIQ $VERSION_NAME" --latest \
            --notes "Download **FormIQ.apk** below and open it on your Android phone to install or update. Step-by-step help: https://superclearice97-droid.github.io/FormIQ/install.html

          File SHA-256: \`$SUM\`
          Signing certificate SHA-256: \`$CERT\`"
      - name: Save build report to the ci-logs branch
        if: always()
        run: |
          {
            echo "run ${{ github.run_number }} · ${{ job.status }} · signed=${SIGNED:-0} · $(date -u)"
            if [ -f "$RUNNER_TEMP/build.log" ]; then
              echo "== errors"; grep -nE "^e: |error:|ERROR|FAILURE|What went wrong|Could not|> " "$RUNNER_TEMP/build.log" | head -150
              echo "== tail"; tail -120 "$RUNNER_TEMP/build.log"
            fi
            ls -la android/app/build/outputs/apk/release/ 2>/dev/null || true
          } > "$RUNNER_TEMP/android-build.txt"
          rm -rf "$RUNNER_TEMP/logs" && git clone -q --depth 1 -b ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$RUNNER_TEMP/logs" || (mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs" && git init -q && git checkout -q -b ci-logs)
          cp "$RUNNER_TEMP/android-build.txt" "$RUNNER_TEMP/logs/"
          cd "$RUNNER_TEMP/logs"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-build.txt && git commit -qm "android build ${{ github.run_number }}" && git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-logs
